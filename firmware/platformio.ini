; Pico-Former firmware for ESP32-S3 (16 MB Quad Flash, in-package PSRAM).
; env:s3_n16r8 is the audit firmware; the other environments differ only in the build flags listed.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 460800
upload_speed = 460800
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -DPROBE_WIFI_TIMEOUT_MS=20000
    -DAUDIT_BAUD=460800
monitor_filters = time, default
; an extra object file changes the link even when empty, so energy_modes.cpp is built only in env:s3_energy
build_src_filter = +<*> -<energy_modes.cpp>
extra_scripts =
    pre:scripts/gen_wifi_header.py
    pre:scripts/gen_build_headers.py

[env:s3_n16r8]

; R1-3: same firmware, weights and thresholds of the second and third independently trained models
[env:s3_s20260829]
build_flags = ${env.build_flags} -DCEQT_WEIGHTS=ceqt_weights_s20260829.h

[env:s3_s20260830]
build_flags = ${env.build_flags} -DCEQT_WEIGHTS=ceqt_weights_s20260830.h

; R2-11 L3: whole-inference timing only (segment timers compiled out)
[env:s3_notiming]
build_flags = ${env.build_flags} -DCEQT_SEGMENT_TIMING=0

; R2-11 L4 / R2-12: optimisation level and fused multiply-add
[env:s3_o2]
build_unflags = -Os
build_flags = ${env.build_flags} -O2

[env:s3_nofma]
build_flags = ${env.build_flags} -ffp-contract=off

; R2-18 fault-injection builds
[env:s3_corrupt_w]
build_flags = ${env.build_flags} -DCEQT_CORRUPT=weight

[env:s3_corrupt_t]
build_flags = ${env.build_flags} -DCEQT_CORRUPT=thr

[env:s3_eatsram]
build_flags = ${env.build_flags} -DTEST_EAT_SRAM=150000

[env:s3_linkdrop]
build_flags = ${env.build_flags} -DTEST_LINK_DROP

; R2-9: energy-measurement modes E1-E7 (debug command 10), cycle marker on GPIO 6
[env:s3_energy]
build_flags = ${env.build_flags} -DTEST_ENERGY
build_src_filter = +<*>

; R1-4: mbedTLS allocations left in internal RAM (prebuilt default)
[env:s3_tls_int]
build_flags = ${env.build_flags} -DTLS_PSRAM=0

; R1-4 / R2-19: deployment build (no serial audit interface, no plain HTTP; HTTPS with access token)
[env:s3_deploy]
build_flags = ${env.build_flags} -DDEPLOY_BUILD=1
