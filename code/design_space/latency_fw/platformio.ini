; R2-15 board latency benchmark. [env] matches pico-former/firmware/platformio.ini (board, flash, PSRAM, -Os);
; Wi-Fi and the web server are not built. One environment per structural configuration.

[platformio]
default_envs = base

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 460800
upload_speed = 460800
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1

[env:d32_l1]
build_flags = ${env.build_flags} -DCFG_d32_l1

[env:d32_l2]
build_flags = ${env.build_flags} -DCFG_d32_l2

[env:d32_l3]
build_flags = ${env.build_flags} -DCFG_d32_l3

[env:d48_l1]
build_flags = ${env.build_flags} -DCFG_d48_l1

[env:base]
build_flags = ${env.build_flags} -DCFG_base

[env:d48_l3]
build_flags = ${env.build_flags} -DCFG_d48_l3

[env:d64_l1]
build_flags = ${env.build_flags} -DCFG_d64_l1

[env:d64_l2]
build_flags = ${env.build_flags} -DCFG_d64_l2

[env:d64_l3]
build_flags = ${env.build_flags} -DCFG_d64_l3

[env:d96_l2]
build_flags = ${env.build_flags} -DCFG_d96_l2

[env:L48]
build_flags = ${env.build_flags} -DCFG_L48

[env:L60]
build_flags = ${env.build_flags} -DCFG_L60

[env:L84]
build_flags = ${env.build_flags} -DCFG_L84

[env:h2]
build_flags = ${env.build_flags} -DCFG_h2

[env:h8]
build_flags = ${env.build_flags} -DCFG_h8
